<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>JS 杨的专属网站</title>
<style>
 *{box-sizing:border-box} html,body{height:100%}
 body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;text-align:center;min-height:100vh;min-height:100dvh;overflow-x:hidden;overflow-y:auto;position:relative;transition:background-color 2.5s ease;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-callout:none}
 img{-webkit-user-drag:none;pointer-events:none}
 #bgOverlay{position:fixed;inset:0;z-index:0;pointer-events:none;background:rgba(0,0,0,0.4)}
 #lockScreen{position:absolute;top:0;left:0;width:100%;min-height:100%;min-height:100dvh;z-index:100;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px 24px;background:#000;transition:opacity .6s ease,visibility .6s ease}
 #lockScreen.unlocked{opacity:0;visibility:hidden;pointer-events:none}
 .lock-title{font-size:24px;font-weight:800;margin-bottom:12px;letter-spacing:2px;opacity:0;transform:translateY(20px);animation:slideUpIn .7s ease forwards;animation-delay:.2s}
 .lock-sub{font-size:14px;color:#888;margin-bottom:36px;opacity:0;transform:translateY(20px);animation:slideUpIn .7s ease forwards;animation-delay:.4s}
 .pwd-wrapper{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;opacity:0;transform:translateY(30px);animation:slideUpIn .8s ease forwards;animation-delay:.6s}
 .pwd-input-wrap{position:relative;display:inline-flex;align-items:center;opacity:0;transform:translateY(20px);animation:slideUpIn .7s ease forwards;animation-delay:.75s}
 .pwd-input{width:200px;height:52px;font-size:24px;font-weight:700;text-align:center;letter-spacing:8px;border:2px solid #333;border-radius:14px;background:#111;color:#fff;outline:none;transition:border-color .2s ease;padding-right:42px;-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none}
 .pwd-input:focus{border-color:#fe2c55}
 .pwd-input.error{border-color:#ff1744;animation:shake .4s ease}
 .pwd-input:disabled{opacity:.4;cursor:not-allowed}
 .toggle-pwd{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:none;border:0;cursor:pointer;opacity:0;animation:fadeIn .5s ease forwards;animation-delay:1.1s;transition:opacity .2s ease;padding:0;z-index:2;color:#ccc}
 .toggle-pwd:hover{opacity:.9;color:#fff}
 .toggle-pwd:disabled{opacity:.2;cursor:not-allowed}
 .verify-btn{height:52px;padding:0 28px;font-size:18px;font-weight:700;border:0;border-radius:14px;background:linear-gradient(135deg,#fe2c55,#ff6a88);color:#fff;cursor:pointer;white-space:nowrap;opacity:0;transform:translateY(20px);animation:slideUpIn .7s ease forwards;animation-delay:.9s}
 .verify-btn:disabled{opacity:.4;cursor:not-allowed}
 @keyframes slideUpIn{to{opacity:1;transform:translateY(0)}}
 @keyframes fadeIn{to{opacity:.5}}
 @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
 .pwd-hint{margin-top:20px;font-size:13px;color:#555;min-height:24px;text-align:center;width:100%;opacity:0;animation:fadeInHint .6s ease forwards;animation-delay:1.3s}
 @keyframes fadeInHint{to{opacity:1}}
 .pwd-hint.wrong{color:#ff1744}
 .pwd-hint.success{color:#00e676}
 .download-hint{margin-top:32px;display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;animation:fadeInHint .6s ease forwards;animation-delay:1.5s}
 .download-icon{width:36px;height:36px;color:#fff;cursor:pointer;transition:opacity .2s ease,transform .15s ease;-webkit-tap-highlight-color:transparent}
 .download-icon:hover{opacity:.8;transform:translateY(2px)}
 .download-icon:active{transform:scale(.92)}
 .download-label{font-size:11px;color:#555;user-select:none}
 #mainContent{display:none;min-height:100vh;position:relative;z-index:2}
 #mainContent.show{display:block}
 .page{min-height:100vh;padding:56px 20px 80px;display:flex;flex-direction:column;align-items:center;gap:34px;max-width:560px;margin:0 auto}
 .name-wrap{height:64px;display:flex;justify-content:center;align-items:center;width:100%}
 #nameCanvas{width:min(82vw,420px);height:52px;image-rendering:pixelated}
 .box{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%}
 .btn{width:86%;max-width:360px;height:60px;border:0;border-radius:18px;font-size:20px;font-weight:700;color:#fff;cursor:pointer;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;line-height:1;padding:0;margin:0 auto;-webkit-appearance:none;appearance:none;font-family:inherit;opacity:0;transform:translateY(80px)}
 .btn.show{animation:btnSlideUp 1s cubic-bezier(.22,.61,.36,1) forwards}
 .btn.dy.show{animation-delay:.3s}
 .btn.qq.show{animation-delay:.55s}
 @keyframes btnSlideUp{0%{opacity:0;transform:translateY(80px)}100%{opacity:1;transform:translateY(0)}}
 .btn:active{transform:translateY(0) scale(.98)}
 .btn::before,.btn::after{content:'';position:absolute;inset:-50%;z-index:0;pointer-events:none}
 .dy::before{background:conic-gradient(from 0deg,#fe2c55,#ff445e,#e6213d,#ff6a88,#fe2c55,#ff1744,#c5002b,#fe2c55);filter:blur(28px) saturate(200%);animation:slimeA 3.2s linear infinite}
 .dy::after{background:conic-gradient(from 160deg,#ff0a44,#fe2c55,#ff8a9d,#e6213d,#ff445e,#b8002a,#ff6a88,#ff0a44);filter:blur(22px) saturate(190%);animation:slimeB 4.5s linear infinite reverse}
 .dy-wash{position:absolute;inset:0;background:radial-gradient(circle at 50% 120%,rgba(254,44,85,.5),transparent 55%),radial-gradient(circle at 50% -20%,rgba(255,106,136,.25),transparent 50%);mix-blend-mode:screen;z-index:0;pointer-events:none;animation:dyWash 3.5s ease-in-out infinite alternate}
 .qq::before{background:conic-gradient(from 0deg,#009cff,#00d4ff,#006cff,#00fff0,#008cff,#005bff,#00b8ff,#009cff);filter:blur(30px) saturate(220%) brightness(1.05);animation:slimeA 3.6s linear infinite}
 .qq::after{background:conic-gradient(from 210deg,#12b7f5,#4fc3f7,#006dff,#00eaff,#2b6cff,#00ffd0,#12b7f5);filter:blur(22px) saturate(210%);animation:slimeB 5s linear infinite reverse}
 .qq-wash{position:absolute;inset:0;background:radial-gradient(circle at 50% 120%,rgba(0,150,255,.45),transparent 55%),radial-gradient(circle at 50% -20%,rgba(0,255,220,.18),transparent 50%);mix-blend-mode:screen;z-index:0;pointer-events:none;animation:qqWash 4s ease-in-out infinite alternate}
 .btn span.label{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;width:100%;height:100%;text-shadow:0 1px 4px rgba(0,0,0,.5);padding-bottom:1px}
 @keyframes slimeA{0%{transform:rotate(0) scale(1)}25%{transform:rotate(90deg) scale(1.12)}50%{transform:rotate(180deg) scale(.92)}75%{transform:rotate(270deg) scale(1.06)}100%{transform:rotate(360deg) scale(1)}}
 @keyframes slimeB{0%{transform:rotate(0) scale(1.1)}33%{transform:rotate(-120deg) scale(.95)}66%{transform:rotate(-240deg) scale(1.15)}100%{transform:rotate(-360deg) scale(1.1)}}
 @keyframes dyWash{0%{opacity:.8;transform:scale(1)}100%{opacity:1;transform:scale(1.05)}}
 @keyframes qqWash{0%{opacity:.85;transform:scale(1)}100%{opacity:1;transform:scale(1.06)}}
 .tip{margin-top:34px;font-size:12px;color:#d0d0d0;opacity:0}
 .tip.show{animation:fadeIn .8s ease forwards;animation-delay:.85s}
 .about{width:100%;max-width:520px;padding:26px 22px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.25);backdrop-filter:blur(6px);text-align:left;opacity:0;transform:translateY(50px);animation:fadeUp 1.1s ease forwards;animation-delay:.3s}
 @keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
 .about h2{margin:0 0 14px;text-align:center;font-size:20px;color:#fe2c55;letter-spacing:1px}
 #typeArea p{margin:0 0 12px;font-size:14.5px;line-height:1.85;color:#d6d6d6;text-align:justify;min-height:1.85em;opacity:0;transform:translateY(40px)}
 #typeArea p.show{animation:paraSlideUp .8s cubic-bezier(.22,.61,.36,1) forwards}
 @keyframes paraSlideUp{0%{opacity:0;transform:translateY(40px)}100%{opacity:1;transform:translateY(0)}}
 .type-cursor{display:inline-block;width:2px;height:1em;background:#fe2c55;animation:blink 1s step-end infinite;vertical-align:text-bottom;margin-left:2px}
 @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
 .sub-btns{display:none;flex-direction:column;align-items:center;gap:14px;width:100%;margin-top:4px}
 .sub-btns.show{display:flex}
 .sub-btn{width:86%;max-width:360px;height:52px;border-radius:16px;font-size:17px;font-weight:700;border:0;cursor:pointer;color:#fff;font-family:inherit;opacity:0;transform:translateY(40px);margin:0 auto}
 .sub-btn.show{animation:btnSlideUp .9s cubic-bezier(.22,.61,.36,1) forwards}
 .sub-group-btn{background:linear-gradient(135deg,#12b7f5 0%,#006dff 100%);animation-delay:.15s}
 .sub-channel-btn{background:linear-gradient(135deg,#7c5cff 0%,#4c1d95 100%);animation-delay:.35s}
 .arrow{margin-left:10px;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;z-index:3;position:relative;transition:transform .3s ease}
 .arrow::before,.arrow::after{content:'';position:absolute;width:11px;height:2.5px;background:#fff;border-radius:1px;top:50%}
 .arrow::before{transform:translateY(-50%) rotate(45deg);left:1px}
 .arrow::after{transform:translateY(-50%) rotate(-45deg);right:1px}
 .arrow.open{transform:rotate(180deg)}
 .arrow:active{opacity:.6}
 .social-footer{display:flex;gap:18px;justify-content:center;align-items:center;padding:26px 0 0;margin-top:10px}
 .social-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);transition:transform .15s ease,background .2s ease}
 .social-icon:hover{transform:translateY(-3px);background:rgba(255,255,255,.12)}
 .social-icon svg{display:block}
 @keyframes noticePop{0%{opacity:0;transform:scale(.85) translateY(20px)}100%{opacity:1;transform:scale(1) translateY(0)}}
 @media (min-width:820px) and (orientation:landscape){.page{flex-direction:row;justify-content:center;align-items:flex-start;gap:56px;max-width:1080px;padding:80px 48px}.left{flex:1;min-width:280px;display:flex;flex-direction:column;align-items:center}.name-wrap{margin-bottom:30px}.box{align-items:center}.btn{width:260px;max-width:none;height:56px;font-size:19px}.tip{margin-top:30px}.about{flex:1;min-width:280px;max-width:none;align-self:flex-start;position:sticky;top:60px}}
 @media (min-width:1100px){.page{gap:72px}.about{padding:30px 28px}.about p{font-size:15px}}
</style>

function typeNextChar(){
 var text = typeQueue[currentPIndex];
 if(currentCharIndex < text.length){
  var charNode = document.createTextNode(text.charAt(currentCharIndex));
  currentP.insertBefore(charNode, cursor);
  currentCharIndex++;
  var jitter = typeSpeed + (Math.random() * 40 - 20);
  setTimeout(typeNextChar, jitter);

  if(cursor) cursor.remove();

  currentPIndex++;

   typeArea.appendChild(document.createElement('br'));

 requestAnimationFrame(frame);

function rnd(max){
 if(window.crypto && window.crypto.getRandomValues){
  var b = new Uint32Array(1);
  window.crypto.getRandomValues(b);
  return b[0] % max;
 }
 return Math.floor(Math.random() * max);
}

}

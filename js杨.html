<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>访问验证</title>
<style>
  *{box-sizing:border-box}
  body{
    background:#000;color:#fff;font-family:sans-serif;text-align:center;
    margin:0;min-height:100vh;display:flex;flex-direction:column;
    justify-content:center;align-items:center;padding:40px 24px 120px;
    -webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;touch-callout:none;
  }
  .title{font-size:24px;font-weight:800;margin-bottom:12px;letter-spacing:2px}
  .sub{font-size:14px;color:#888;margin-bottom:36px}
  .pwd-wrapper{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
  .pwd-input{
    width:200px;height:52px;font-size:24px;font-weight:700;text-align:center;
    letter-spacing:8px;border:2px solid #333;border-radius:14px;background:#111;
    color:#fff;outline:none;transition:border-color .2s ease;-webkit-text-security:disc;
    -webkit-user-select:auto;user-select:auto;
  }
  .pwd-input:focus{border-color:#fe2c55}
  .pwd-input.error{border-color:#ff1744;animation:shake .4s ease}
  @keyframes shake{
    0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}
    40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}
  }
  .verify-btn{
    height:52px;padding:0 28px;font-size:18px;font-weight:700;border:0;border-radius:14px;
    background:linear-gradient(135deg,#fe2c55,#ff6a88);color:#fff;cursor:pointer;
    transition:transform .15s ease,box-shadow .15s ease;white-space:nowrap;
  }
  .verify-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(254,44,85,.35)}
  .verify-btn:active{transform:translateY(0) scale(.97)}
  .hint{margin-top:20px;font-size:13px;color:#555;min-height:20px}
  .hint.wrong{color:#ff1744}
  .hint.success{color:#00e676}

  .qr-trigger{
    margin-top:90px;
    padding:14px 28px;
    border:0;
    border-radius:999px;
    color:#ff5f7a;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    border:1px solid rgba(254,44,85,.45);
    background:linear-gradient(180deg,rgba(254,44,85,.08),rgba(254,44,85,.02));
  }
  .qr-trigger:active{background:rgba(254,44,85,.15)}

  /* 二维码弹窗 */
  .qr-mask{
    position:fixed;inset:0;background:rgba(0,0,0,.85);
    display:none;justify-content:center;align-items:center;z-index:50;
  }
  .qr-mask.show{display:flex}
  .qr-card{
    background:#111;border-radius:24px;padding:36px 32px;text-align:center;
    box-shadow:0 10px 50px rgba(0,0,0,.6);
  }
  .qr-card canvas,.qr-card img{border-radius:12px;background:#fff;padding:12px;display:block;margin:0 auto}
  .qr-card .close-btn{
    margin-top:20px;padding:12px 40px;border:0;border-radius:12px;
    background:linear-gradient(135deg,#333,#222);color:#fff;font-size:15px;font-weight:700;cursor:pointer;
  }
</style>
</head>
<body oncontextmenu="return false;">

  <div class="title">🔒 访问验证</div>
  <div class="sub">请输入访问密码</div>

  <div class="pwd-wrapper">
    <input class="pwd-input" id="pwdInput" type="password" maxlength="4" placeholder="●●●●" autocomplete="current-password" inputmode="text" />
    <button class="verify-btn" onclick="checkPassword()">验证</button>
  </div>

  <div class="hint" id="hint"></div>

  <button class="qr-trigger" onclick="showQR()">没有密码？请扫描下方二维码</button>

  <!-- 二维码弹窗：不显示任何密码文字 -->
  <div class="qr-mask" id="qrMask" onclick="closeQR(event)">
    <div class="qr-card" onclick="event.stopPropagation()">
      <div id="qrCode"></div>
      <button class="close-btn" onclick="closeQR()">关闭</button>
    </div>
  </div>

<script src="https://fastly.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
  var CORRECT = 'CFTH';
  var input = document.getElementById('pwdInput');
  var hint = document.getElementById('hint');
  var qrGenerated = false;

  input.focus();
  input.addEventListener('keydown', function(e){ if(e.key === 'Enter') checkPassword(); });

  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('keydown', function(e){
    if((e.ctrlKey||e.metaKey) && ['c','x','s','u','a','v'].includes(e.key.toLowerCase())) e.preventDefault();
  });

  function checkPassword(){
    var val = input.value.toUpperCase();
    if(val.length === 0){ hint.textContent='请输入密码'; hint.className='hint wrong'; return; }
    if(val === CORRECT){
      hint.textContent='✓ 验证通过'; hint.className='hint success';
    } else {
      hint.textContent='密码错误，请重试'; hint.className='hint wrong';
      input.classList.add('error'); input.value='';
      setTimeout(function(){ input.classList.remove('error'); }, 500);
      input.focus();
    }
  }

  function showQR(){
    var box = document.getElementById('qrCode');
    if(!qrGenerated){
      box.innerHTML='';
      new QRCode(box, { text: 'CFTH', width: 200, height: 200 });
      qrGenerated = true;
    }
    document.getElementById('qrMask').classList.add('show');
  }

  function closeQR(e){
    if(e && e.target !== e.currentTarget && e.type === 'click') return;
    document.getElementById('qrMask').classList.remove('show');
  }
</script>
</body>
</html>

<script>
/**
 * =========================================================================
 * 核心模块 1：物理弹簧引擎 (高刷适配 + 惯性继承)
 * 基于半隐式欧拉积分（Semi-implicit Euler），完美兼容 60Hz ~ 144Hz。
 * =========================================================================
 */
class SpringEngine {
  constructor(config = {}) {
    this.value = 0;       // 当前位置
    this.target = 0;      // 目标位置
    this.velocity = 0;    // 当前速度
    
    // 张力越大回弹越快，摩擦力越大停止越快
    this.tension = config.tension || 150;
    this.friction = config.friction || 20;
    this.precision = config.precision || 0.01;
    
    this.onUpdate = config.onUpdate || function(){};
    this.onComplete = config.onComplete || function(){};
    
    this.isAnimating = false;
    this.rafId = null;
    this.lastTime = 0;

    this.tick = this.tick.bind(this);
  }

  // 同步外部（拖拽时）的实时位置，防止松手瞬间发生跳动
  sync(val) {
    this.value = val;
    this.onUpdate(val);
  }

  // 赋予初速度（继承用户拖拽甩出的手速）
  inheritVelocity(v) {
    this.velocity = v;
  }

  // 启动弹簧动画
  to(target) {
    this.target = target;
    if (!this.isAnimating) {
      this.isAnimating = true;
      // 启动前先重置时间戳，防止 dt 过大
      this.lastTime = performance.now();
      this.rafId = requestAnimationFrame(this.tick);
    }
  }

  // 停止动画
  stop() {
    if (this.rafId) {
      cancelAnimationFrame(this.rafId);
      this.rafId = null;
    }
    this.isAnimating = false;
    this.velocity = 0;
  }

  // 逐帧计算
  tick(now) {
    // 计算时间差，转换为秒
    let dt = (now - this.lastTime) / 1000;
    this.lastTime = now;
    
    // 防止切后台回来导致 dt 过大直接飞出屏幕
    if (dt > 0.064) dt = 0.064;

    // 胡克定律 + 阻尼：a = (tension * displacement) - (friction * velocity)
    const displacement = this.target - this.value;
    const springForce = this.tension * displacement;
    const dampingForce = this.friction * this.velocity;
    const acceleration = springForce - dampingForce;

    // 积分更新速度和位置
    this.velocity += acceleration * dt;
    this.value += this.velocity * dt;

    this.onUpdate(this.value);

    // 当距离目标足够近且速度足够小时，结束动画
    if (Math.abs(displacement) < this.precision && Math.abs(this.velocity) < this.precision) {
      this.value = this.target;
      this.onUpdate(this.value);
      this.velocity = 0;
      this.isAnimating = false;
      this.onComplete();
      return;
    }

    this.rafId = requestAnimationFrame(this.tick);
  }
}

/**
 * =========================================================================
 * 核心模块 2：手势追踪拦截器
 * 封装 Pointer Events，处理阈值判定、速度平滑采样和点击冒泡。
 * =========================================================================
 */
class GestureTracker {
  constructor(element, options = {}) {
    this.el = element;
    this.threshold = options.threshold || 5;
    
    this.onStart = options.onStart || function(){};
    this.onMove = options.onMove || function(){};
    this.onEnd = options.onEnd || function(){};
    this.onClick = options.onClick || function(){};
    
    this.isDragging = false;
    this.hasMoved = false;
    this.pointerId = null;
    
    // 采样池，用于计算滑动速度
    this.points = [];
    
    this.bind();
  }

  bind() {
    this.el.addEventListener('pointerdown', (e) => this.down(e), { passive: false });
    this.el.addEventListener('pointermove', (e) => this.move(e), { passive: false });
    this.el.addEventListener('pointerup', (e) => this.up(e));
    this.el.addEventListener('pointercancel', (e) => this.up(e));
  }

  down(e) {
    if (!e.isPrimary || e.button !== 0) return;
    // 阻止默认行为（如图片拖拽、文本选中）
    e.preventDefault();
    try { this.el.setPointerCapture(e.pointerId); } catch (_) {}

    this.pointerId = e.pointerId;
    this.isDragging = true;
    this.hasMoved = false;
    this.points = [{ x: e.clientX, y: e.clientY, t: performance.now() }];

    this.onStart(e);
  }

  move(e) {
    if (!this.isDragging || e.pointerId !== this.pointerId) return;
    e.preventDefault();

    const last = this.points[this.points.length - 1];
    const dx = e.clientX - last.x;
    const dy = e.clientY - last.y;

    // 阈值判定：只有滑动超过一定距离才算拖拽，否则认为是点击
    if (!this.hasMoved) {
      const start = this.points[0];
      if (Math.abs(e.clientX - start.x) > this.threshold || Math.abs(e.clientY - start.y) > this.threshold) {
        this.hasMoved = true;
      } else {
        return;
      }
    }

    // 限制采样点数量，避免内存泄漏和计算量过大
    this.points.push({ x: e.clientX, y: e.clientY, t: performance.now() });
    if (this.points.length > 6) this.points.shift();

    this.onMove(e, dx, dy);
  }

  up(e) {
    if (!this.isDragging || e.pointerId !== this.pointerId) return;
    this.isDragging = false;
    this.pointerId = null;
    try { this.el.releasePointerCapture(e.pointerId); } catch (_) {}

    if (this.hasMoved) {
      // 计算最后的惯性速度
      let vx = 0, vy = 0;
      if (this.points.length > 1) {
        const first = this.points[0];
        const last = this.points[this.points.length - 1];
        const dt = Math.max(1, last.t - first.t);
        // 速度 = 距离 / 时间
        vx = (last.x - first.x) / dt * 1000;
        vy = (last.y - first.y) / dt * 1000;
      }
      this.onEnd(e, vx, vy);
    } else {
      this.onClick(e);
    }
  }
}

  const springModalX = new SpringEngine({
    tension: 180, friction: 22,
    onUpdate: (val) => setModalTransform(val, springModalY.value)
  });
  const springModalY = new SpringEngine({
    tension: 180, friction: 22,
    onUpdate: (val) => setModalTransform(springModalX.value, val)
  });

  // 弹窗手势绑定
  new GestureTracker(modal, {
    threshold: 6,
    onStart: (e) => {
      // 如果按在内部按钮上，忽略弹窗拖拽
      if (e.target.closest('#btn')) return;
      springModalX.stop();
      springModalY.stop();
    },
    onMove: (e, dx, dy) => {
      if (e.target.closest('#btn')) return;
      
      let nextX = springModalX.value + dx;
      let nextY = springModalY.value + dy;

      // 边界限制
      nextX = Math.max(0, Math.min(WIN_W - MODAL_W, nextX));
      nextY = Math.max(0, Math.min(WIN_H - MODAL_H, nextY));

      springModalX.sync(nextX);
      springModalY.sync(nextY);
    },
    onEnd: (e, vx, vy) => {
      if (e.target.closest('#btn')) return;
      const home = getModalHome();
      
      // 继承甩出的速度（乘一个阻尼系数，防止太快）
      springModalX.inheritVelocity(vx * 0.8);
      springModalY.inheritVelocity(vy * 0.8);
      
      // 启动回弹
      springModalX.to(home.x);
      springModalY.to(home.y);
    }
  });

  // 阻止内部按钮的指针事件冒泡到弹窗外层
  btn.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
  });

  /* =======================================================================
     2. 弹窗内“确定”按钮（Btn）独立拖拽与回弹
     ======================================================================= */
  const setBtnTransform = (x, y) => {
    btn.style.transform = `translate3d(${x}px, ${y}px, 0)`;
  };

  const springBtnX = new SpringEngine({
    tension: 250, friction: 20, // 比弹窗更 Q 弹
    onUpdate: (val) => setBtnTransform(val, springBtnY.value)
  });
  const springBtnY = new SpringEngine({
    tension: 250, friction: 20,
    onUpdate: (val) => setBtnTransform(springBtnX.value, val)
  });

  new GestureTracker(btn, {
    threshold: 5,
    onStart: () => {
      springBtnX.stop();
      springBtnY.stop();
    },
    onMove: (e, dx, dy) => {
      let nextX = springBtnX.value + dx;
      let nextY = springBtnY.value + dy;

      // 严格计算边界：只能在弹窗框内滑动
      // CSS 中 left:36px, width:calc(100%-72px)
      const minX = -36;
      const maxX = 36;
      const minY = -(MODAL_H - BTN_H - 68); // 顶部留 32px 边距
      const maxY = 0;

      nextX = Math.max(minX, Math.min(maxX, nextX));
      nextY = Math.max(minY, Math.min(maxY, nextY));

      springBtnX.sync(nextX);
      springBtnY.sync(nextY);
    },
    onEnd: (e, vx, vy) => {
      // 继承手速
      springBtnX.inheritVelocity(vx * 0.7);
      springBtnY.inheritVelocity(vy * 0.7);
      
      // 归位到 0,0
      springBtnX.to(0);
      springBtnY.to(0);
    },
    onClick: () => {
      hideModal();
    }
  });

  /* =======================================================================
     3. 悬浮球（FAB）全屏拖拽
     ======================================================================= */
  const setFabTransform = (x, y) => {
    fab.style.transform = `translate3d(${x}px, ${y}px, 0)`;
  };

  // 悬浮球坐标变量
  let fabX = 0, fabY = 0;

  new GestureTracker(fab, {
    threshold: 4,
    onStart: () => {},
    onMove: (e, dx, dy) => {
      fabX += dx;
      fabY += dy;
      
      // 限制在屏幕安全区内
      const margin = 20;
      fabX = Math.max(margin, Math.min(WIN_W - FAB_W - margin, fabX));
      fabY = Math.max(margin, Math.min(WIN_H - FAB_H - margin, fabY));
      
      setFabTransform(fabX, fabY);
    },
    onEnd: () => {},
    onClick: () => {
      showModal('shizuku');
    }
  });

  // 初始化悬浮球位置
  const initFab = () => {
    updateCache();
    fabX = WIN_W - FAB_W - 24;
    fabY = WIN_H - FAB_H - 34;
    setFabTransform(fabX, fabY);
    fab.classList.add('ready');
  };

  /* =======================================================================
     4. 弹窗显示/隐藏控制
     ======================================================================= */
  const showModal = (type) => {
    if (isModalOpen) return;
    isModalOpen = true;
    clearTimeout(hideTimer);

    // 填充内容
    if (type === 'shizuku') {
      titleEl.textContent = 'Shizuku 使用前提示';
      descEl.innerHTML = '本工具运行时依赖 <b>Shizuku 授权</b>。<br>Android 11+ 推荐通过「无线调试」激活；<br>ColorOS 需关闭相关权限监控限制。<br><br>包名核对：<b>moe.shizuku.privileged.api</b><br>未激活状态下打开应用将没有实际作用。';
    } else {
      titleEl.textContent = '爱玩机工具箱提示';
      descEl.innerHTML = '部分功能需配合 <b>Shizuku</b> 授权使用。<br>支持 Android 5.0+，免 Root 即可使用大部分功能。<br><br>包名核对：<b>com.byyoung.setting</b>';
    }

    mask.style.display = 'flex';
    // 触发重绘，确保 transition 动画生效
    void mask.offsetWidth;
    mask.classList.add('show');
    document.body.style.overflow = 'hidden';

    // 更新尺寸并重置位置
    updateCache();
    const home = getModalHome();
    
    springModalX.stop();
    springModalY.stop();
    springModalX.sync(home.x);
    springModalY.sync(home.y);

    springBtnX.stop();
    springBtnY.stop();
    springBtnX.sync(0);
    springBtnY.sync(0);
  };

  const hideModal = () => {
    if (!isModalOpen) return;
    isModalOpen = false;

    mask.classList.remove('show');
    document.body.style.overflow = '';
    
    hideTimer = setTimeout(() => {
      mask.style.display = 'none';
    }, 350);
  };

  /* =======================================================================
     5. 全局事件绑定
     ======================================================================= */
  // 点击遮罩关闭
  mask.addEventListener('pointerdown', (e) => {
    if (e.target === mask) {
      hideModal();
    }
  });

  // 点击包名弹出对应提示
  document.querySelectorAll('.pkg').forEach(el => {
    el.addEventListener('click', (e) => {
      e.preventDefault();
      showModal(el.dataset.app);
    });
  });

  // 启动悬浮球
  initFab();

})();
</script>
</body>
</html>

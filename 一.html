<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>高精度年龄计算器</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  background: #0d0d12; color: #fff; min-height: 100vh; overflow-x: hidden;
  font-size: 13px;
}

#bgImg { position: fixed; inset: 0; z-index: 0; background-size: cover; background-position: center; display: none; }
#bgVideo { position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
#bgScrim { position: fixed; inset: 0; z-index: 1; background: rgba(10,10,16,0.4); }

#appUI { position: relative; z-index: 2; padding: 50px 14px 30px; transition: opacity 0.25s ease; }
/* 关键：纯明时穿透 */
#appUI.no-pointer { pointer-events: none; }

.container { max-width: 420px; margin: 0 auto; }

h1 { text-align: center; font-size: 17px; font-weight: 700; margin-bottom: 14px; letter-spacing: .3px; }

.glass {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(24px) saturate(200%);
  -webkit-backdrop-filter: blur(24px) saturate(200%);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 18px; padding: 14px; margin-bottom: 10px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.25);
}

.label { font-size: 11px; opacity: 0.7; margin-bottom: 8px; text-align: center; }
.input-row { display: flex; align-items: center; gap: 5px; margin-bottom: 8px; }
.input-box { flex: 1; }
.input-box input {
  width: 100%; padding: 10px 4px; border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.06);
  color: #fff; font-size: 15px; text-align: center; outline: none;
}
.sep { opacity: 0.5; font-size: 14px; }
.hint { font-size: 10px; opacity: 0.6; text-align: center; margin: 6px 0; min-height: 12px; }
.hint.modified { color: #ff9f0a; }

.glass-btn {
  width: 100%; padding: 12px; border-radius: 12px; border: none;
  background: rgba(255,255,255,0.16); color: #fff; font-size: 14px; font-weight: 600;
  margin-top: 8px; cursor: pointer; transition: 0.15s;
}
.glass-btn:active { background: rgba(255,255,255,0.26); transform: scale(0.98); }

.ghost-btn {
  width: 100%; padding: 10px; border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.18); background: transparent; color: #fff;
  font-size: 12px; margin-top: 6px; cursor: pointer;
}
input[type=file] { display: none; }

.precision-value { font-size: 28px; font-weight: 700; text-align: center; margin: 4px 0; font-variant-numeric: tabular-nums; }
.precision-label { text-align: center; font-size: 10px; opacity: 0.6; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
.item { text-align: center; padding: 8px 2px; background: rgba(255,255,255,0.05); border-radius: 10px; }
.item-num { font-size: 15px; font-weight: 700; }
.item-unit { font-size: 9px; opacity: 0.6; margin-top: 1px; }
.birthday { text-align: center; padding: 12px; }
.birthday-label { font-size: 11px; opacity: 0.6; margin-bottom: 3px; }
.birthday-value { font-size: 17px; font-weight: 600; }

#settingsBtn {
  position: fixed; top: 12px; right: 12px; z-index: 100;
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(255,255,255,0.14); backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.22);
  display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer;
}

#settingsPanel {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.45); display: none; align-items: center; justify-content: center;
  backdrop-filter: blur(6px);
}
#settingsPanel.show { display: flex; }

.settings-card {
  background: rgba(255,255,255,0.72);
  backdrop-filter: blur(50px) saturate(220%);
  -webkit-backdrop-filter: blur(50px) saturate(220%);
  border-radius: 24px; padding: 20px;
  width: 300px; max-width: 90vw; box-shadow: 0 20px 60px rgba(0,0,0,0.35);
}
.settings-card h3 { font-size: 17px; font-weight: 700; color: #000; margin-bottom: 16px; }

.slider-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.slider-name { font-size: 13px; font-weight: 500; color: #000; }
.slider-val { font-size: 13px; font-weight: 600; color: #007aff; }

.slider-track {
  position: relative; height: 5px; background: rgba(120,120,128,0.22);
  border-radius: 2.5px; cursor: pointer; touch-action: none; margin: 26px 0;
}
.slider-fill { position: absolute; left: 0; top: 0; height: 100%; background: #007aff; border-radius: 2.5px; pointer-events: none; }

.slider-thumb {
  position: absolute; top: 50%;
  width: 34px; height: 22px;
  background: #ffffff;
  border-radius: 11px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.22);
  transform: translate(-50%, -50%) scale(1);
  cursor: grab;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), width 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.15s, box-shadow 0.15s;
  z-index: 2;
}
.slider-thumb::before {
  content: ''; position: absolute; inset: 1.5px;
  border-radius: inherit;
  border: 1px solid rgba(255,255,255,0.55);
  opacity: 0; transition: opacity 0.15s; pointer-events: none;
}
.slider-thumb::after {
  content: ''; position: absolute;
  top: 2px; left: 6px; right: 6px; height: 5px;
  border-radius: 50%;
  background: rgba(255,255,255,0.7);
  opacity: 0; transition: opacity 0.15s; pointer-events: none;
}
.slider-thumb.pressing {
  transform: translate(-50%, -50%) scale(0.88);
  background: #f0f0f0;
}
.slider-thumb.active {
  background: rgba(255,255,255,0) !important;
  border: none !important;
  box-shadow: none !important;
  backdrop-filter: blur(2px) saturate(180%) brightness(1.25);
  -webkit-backdrop-filter: blur(2px) saturate(180%) brightness(1.25);
  cursor: grabbing;
  transform: translate(-50%, -50%) scale(1);
  transition: width 0.1s ease-out, background 0.15s, box-shadow 0.15s;
}
.slider-thumb.active::before { opacity: 1; }
.slider-thumb.active::after { opacity: 1; }
.slider-thumb.releasing {
  transform: translate(-50%, -50%) scale(1.08);
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), width 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.close-btn {
  width: 100%; padding: 12px; border-radius: 12px; border: none;
  background: rgba(120,120,128,0.16); color: #000;
  font-size: 14px; font-weight: 600; margin-top: 14px; cursor: pointer;
}
.close-btn:active { background: rgba(120,120,128,0.26); }
</style>
</head>
<body>
<div id="bgImg"></div>
<video id="bgVideo" playsinline muted loop preload="metadata"></video>
<div id="bgScrim"></div>

<div id="settingsBtn">⚙️</div>

<div id="settingsPanel">
  <div class="settings-card">
	<h3>设置</h3>
	<div class="slider-row">
	  <div class="slider-head">
		<span class="slider-name">界面透明度</span>
		<span class="slider-val" id="vUI">100%</span>
	  </div>
	  <div class="slider-track" id="trUI">
		<div class="slider-fill"></div>
		<div class="slider-thumb" data-val="100"></div>
	  </div>
	</div>
	<button class="close-btn" id="closeSet">关闭</button>
  </div>
</div>

<div id="appUI">
<div class="container">
  <h1>高精度年龄计算器</h1>
  <div class="glass">
	<div class="label">出生日期（默认今天往前16年，每天自动更新）</div>
	<div class="input-row">
	  <div class="input-box"><input type="tel" id="yearInput" maxlength="4" placeholder="年" inputmode="numeric"></div>
	  <span class="sep">-</span>
	  <div class="input-box"><input type="tel" id="monthInput" maxlength="2" placeholder="月" inputmode="numeric"></div>
	  <span class="sep">-</span>
	  <div class="input-box"><input type="tel" id="dayInput" maxlength="2" placeholder="日" inputmode="numeric"></div>
	</div>
	<div class="hint" id="hint">默认今天往前16年，已自动计算</div>
	<button class="glass-btn" onclick="startCalc()">开始计算</button>
	<button class="ghost-btn" onclick="document.getElementById('pickBg').click()">从相册选照片或视频当背景</button>
	<input type="file" id="pickBg" accept="image/*,video/*">
  </div>
  <div class="glass result">
	<div id="preciseAge" class="precision-value">--</div>
	<div class="precision-label">岁（精度 16 位小数，实时刷新）</div>
  </div>
  <div class="glass">
	<div style="font-size:11px;opacity:0.7;margin-bottom:2px;">详细数据</div>
	<div class="grid">
	  <div class="item"><div class="item-num" id="rYears">--</div><div class="item-unit">年</div></div>
	  <div class="item"><div class="item-num" id="rMonths">--</div><div class="item-unit">月</div></div>
	  <div class="item"><div class="item-num" id="rDays">--</div><div class="item-unit">天</div></div>
	  <div class="item"><div class="item-num" id="rHours">--</div><div class="item-unit">小时</div></div>
	  <div class="item"><div class="item-num" id="rMinutes">--</div><div class="item-unit">分钟</div></div>
	  <div class="item"><div class="item-num" id="rSeconds">--</div><div class="item-unit">秒</div></div>
	</div>
  </div>
  <div class="glass birthday">
	<div class="birthday-label">距离下一个生日</div>
	<div id="nextBirthday" class="birthday-value">--</div>
  </div>
</div>
</div>

<script>
/* 滑块 */
(function(){
  const tr=document.getElementById('trUI'), fill=tr.querySelector('.slider-fill'), thumb=tr.querySelector('.slider-thumb'), valEl=document.getElementById('vUI'), appUI=document.getElementById('appUI');
  const min=0, max=100; let val=100, dragging=false, lastX=0, lastT=0, velocity=0, stretch=0, rafId=null, pressTimer=null;
  function setV(v){ v=Math.max(min,Math.min(max,v)); val=v; const pct=(val/max)*100; fill.style.width=pct+'%'; thumb.style.left=pct+'%'; valEl.textContent=Math.round(v)+'%'; appUI.style.opacity=v/100; if(v<=0){ appUI.classList.add('no-pointer'); } else { appUI.classList.remove('no-pointer'); } }
  function getP(e){ const r=tr.getBoundingClientRect(); let x=e.touches?e.touches[0].clientX:e.clientX; return Math.max(0,Math.min(1,(x-r.left)/r.width)); }
  function applyStretch(){ if(dragging){ const target=Math.min(velocity*0.15,10); stretch+=(target-stretch)*0.4; const w=34+stretch; thumb.style.width=w+'px'; thumb.style.borderRadius=(w/2)+'px'; rafId=requestAnimationFrame(applyStretch); } else { stretch+=(0-stretch)*0.3; const ww=34+stretch; thumb.style.width=ww+'px'; thumb.style.borderRadius=(ww/2)+'px'; if(Math.abs(stretch)>0.3){ rafId=requestAnimationFrame(applyStretch); } else { thumb.style.width='34px'; thumb.style.borderRadius='11px'; } } }
  function onMove(e){ if(!dragging) return; const x=e.touches?e.touches[0].clientX:e.clientX; const now=performance.now(); if(lastT){ velocity=Math.abs(x-lastX)/Math.max(now-lastT,1)*16; } lastX=x; lastT=now; setV(getP(e)*(max-min)+min); }
  function onDown(e){ e.preventDefault(); e.stopPropagation(); lastT=0; velocity=0; stretch=0; thumb.classList.remove('releasing'); thumb.classList.add('pressing'); pressTimer=setTimeout(()=>{ dragging=true; thumb.classList.remove('pressing'); thumb.classList.add('active'); thumb.style.transition='none'; rafId=requestAnimationFrame(applyStretch); }, 80); }
  thumb.addEventListener('touchstart',onDown,{passive:false}); thumb.addEventListener('mousedown',onDown);
  document.addEventListener('touchmove',e=>{ if(dragging){ onMove(e); e.preventDefault(); } },{passive:false}); document.addEventListener('mousemove',e=>{ if(dragging) onMove(e); });
  function endDrag(){ if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; } if(!dragging){ thumb.classList.remove('pressing'); return; } dragging=false; thumb.classList.remove('active'); thumb.style.transition=''; thumb.classList.add('releasing'); requestAnimationFrame(applyStretch); localStorage.setItem('age_ui_opacity',Math.round(val)); setTimeout(()=>{ thumb.classList.remove('releasing'); },250); }
  document.addEventListener('touchend',endDrag); document.addEventListener('mouseup',endDrag);
  tr.addEventListener('touchstart',e=>{ if(!dragging){ const p=getP(e); setV(p*(max-min)+min); thumb.classList.add('pressing'); setTimeout(()=>thumb.classList.remove('pressing'),200); } },{passive:false});
  tr.addEventListener('mousedown',e=>{ if(!dragging){ const p=getP(e); setV(p*(max-min)+min); thumb.classList.add('pressing'); setTimeout(()=>thumb.classList.remove('pressing'),200); } });
  const saved=localStorage.getItem('age_ui_opacity'); setV(saved!==null?parseInt(saved):100);
})();

/* 设置面板 */
const setBtn=document.getElementById('settingsBtn'), setPanel=document.getElementById('settingsPanel'), closeSet=document.getElementById('closeSet');
setBtn.onclick=()=>setPanel.classList.add('show'); closeSet.onclick=()=>setPanel.classList.remove('show');
setPanel.addEventListener('click',function(e){ if(e.target===setPanel)setPanel.classList.remove('show'); });

/* 计算器 */
const yi=document.getElementById('yearInput'), mi=document.getElementById('monthInput'), di=document.getElementById('dayInput'), hint=document.getElementById('hint');
const STORAGE_KEY='age_calc_birth', BG_KEY='age_calc_bg', MIN_YEAR=1900;
let currentBirth=null, timer=null, lastDayCheck=new Date().getDate(), currentObjUrl=null;
function getDefaultBirth(){ const t=new Date(); t.setFullYear(t.getFullYear()-16); return t; }
function fillDefault(){ const def=getDefaultBirth(); yi.value=def.getFullYear(); mi.value=String(def.getMonth()+1).padStart(2,'0'); di.value=String(def.getDate()).padStart(2,'0'); }
function init(){ const saved=localStorage.getItem(STORAGE_KEY); if(saved){ const p=saved.split('-'), y=parseInt(p[0]); if(y>=MIN_YEAR&&p[1]&&p[2]){ yi.value=y; mi.value=p[1]; di.value=p[2]; hint.textContent='请手动点开始计算'; } else { fillDefault(); hint.textContent='默认今天往前16年，已自动计算'; } } else { fillDefault(); hint.textContent='默认今天往前16年，已自动计算'; } loadBg(); } init();
function markChanged(){ hint.textContent='已修改日期，请点击「开始计算」'; hint.className='hint modified'; }
yi.addEventListener('input',function(){ let v=this.value.replace(/\D/g,''); if(v.length>4)v=v.slice(0,4); this.value=v; if(v.length===4){ const y=parseInt(v); if(y<MIN_YEAR){this.value='1900';} mi.focus(); } markChanged(); });
mi.addEventListener('input',function(){ let v=this.value.replace(/\D/g,''); if(v.length>2)v=v.slice(0,2); this.value=v; if(v.length===2)di.focus(); markChanged(); });
di.addEventListener('input',function(){ let v=this.value.replace(/\D/g,''); if(v.length>2)v=v.slice(0,2); this.value=v; markChanged(); });
function startCalc(){ const y=parseInt(yi.value),m=parseInt(mi.value),d=parseInt(di.value); if(!y||!m||!d){ hint.textContent='请输入完整日期'; return; } if(y<MIN_YEAR){ hint.textContent='年份不能早于1900年'; return; } if(m<1||m>12||d<1||d>31){ hint.textContent='日期不合法'; return; } const birth=new Date(y,m-1,d,0,0,0); if(isNaN(birth.getTime())){ hint.textContent='日期不存在，请检查'; return; } const today0=new Date(); today0.setHours(0,0,0,0); if(birth>=today0){ hint.textContent='请选择今天之前的日期'; return; } localStorage.setItem(STORAGE_KEY,y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')); currentBirth=birth; hint.textContent='已计算'; hint.className='hint'; if(timer)clearInterval(timer); doCalc(); timer=setInterval(doCalc,50); }
function doCalc(){ if(!currentBirth)return; const now=new Date(), diff=now-currentBirth, msY=365.2425*24*60*60*1000; document.getElementById('preciseAge').textContent=(diff/msY).toFixed(16); document.getElementById('rYears').textContent=Math.floor(diff/(365.2425*24*60*60*1000)); document.getElementById('rMonths').textContent=Math.floor(diff/(30.436875*24*60*60*1000)); document.getElementById('rDays').textContent=Math.floor(diff/(24*60*60*1000)); document.getElementById('rHours').textContent=Math.floor(diff/(60*60*1000)).toLocaleString(); document.getElementById('rMinutes').textContent=Math.floor(diff/(60*1000)).toLocaleString(); document.getElementById('rSeconds').textContent=Math.floor(diff/1000).toLocaleString(); const bm=currentBirth.getMonth(), bd=currentBirth.getDate(); let nb=new Date(now.getFullYear(),bm,bd); if(nb<now)nb=new Date(now.getFullYear()+1,bm,bd); const rem=nb-now, dl=Math.ceil(rem/(24*60*60*1000)), hl=Math.floor((rem%(24*60*60*1000))/(60*60*1000)), ml=Math.floor((rem%(60*60*1000))/(60*1000)), sl=Math.floor((rem%(60*1000))/1000); document.getElementById('nextBirthday').textContent=(dl<=0&&hl===0&&ml===0&&sl<=1)?'🎉 生日快乐！':dl+'天'+hl+'时'+ml+'分'+sl+'秒'; const today=new Date(); if(today.getDate()!==lastDayCheck){ lastDayCheck=today.getDate(); if(!localStorage.getItem(STORAGE_KEY)){ fillDefault(); currentBirth=getDefaultBirth(); hint.textContent='已跨天，默认日期自动更新为今天往前16年'; } } }
function loadBg(){ const b64=localStorage.getItem(BG_KEY); if(b64){ document.getElementById('bgImg').style.backgroundImage='url('+b64+')'; document.getElementById('bgImg').style.display='block'; } }
document.getElementById('pickBg').addEventListener('change',function(e){ const file=e.target.files&&e.target.files[0]; if(!file)return; if(currentObjUrl){ URL.revokeObjectURL(currentObjUrl); currentObjUrl=null; } const v=document.getElementById('bgVideo'); v.pause(); v.removeAttribute('src'); v.load(); v.style.display='none'; document.getElementById('bgImg').style.display='none'; document.getElementById('bgImg').style.backgroundImage='none'; if(file.type.startsWith('video/')){ currentObjUrl=URL.createObjectURL(file); v.src=currentObjUrl; v.style.display='block'; v.play().catch(()=>{}); localStorage.removeItem(BG_KEY); } else { currentObjUrl=URL.createObjectURL(file); document.getElementById('bgImg').style.backgroundImage='url('+currentObjUrl+')'; document.getElementById('bgImg').style.display='block'; const reader=new FileReader(); reader.onload=function(){ try{ localStorage.setItem(BG_KEY,reader.result); }catch(_){} }; reader.readAsDataURL(file); } });
document.addEventListener('visibilitychange',function(){ if(!document.hidden && document.getElementById('bgVideo').style.display==='block'){ document.getElementById('bgVideo').play().catch(()=>{}); } });
currentBirth=getDefaultBirth(); doCalc(); timer=setInterval(doCalc,50);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>高精度年龄计算器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  body { background: #f5f5f5; padding: 14px; color: #333; }
  .container { max-width: 480px; margin: 0 auto; }
  h1 { text-align: center; font-size: 20px; margin: 16px 0; font-weight: 700; }
  .card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  .label { font-size: 13px; color: #666; margin-bottom: 10px; }
  .input-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 8px; }
  .input-box { flex: 1; }
  input { width: 100%; padding: 11px 6px; font-size: 17px; text-align: center; border: 1.5px solid #ddd; border-radius: 10px; background: #fff; color: #111; outline: none; -webkit-appearance: none; }
  input:focus { border-color: #111; }
  .sep { font-size: 16px; color: #999; font-weight: bold; }
  .hint { text-align: center; font-size: 11px; color: #999; margin: 8px 0 12px; }
  .hint.modified { color: #d93025; }
  button { width: 100%; padding: 12px; background: #000; color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:active { opacity: 0.8; }
  .result { text-align: center; padding: 18px 10px; }
  .precision-value { font-size: 26px; font-weight: 700; color: #111; white-space: nowrap; overflow-x: auto; }
  .precision-value.error { color: #d93025; font-size: 20px; }
  .precision-label { font-size: 12px; color: #888; margin-top: 6px; }
  .grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .item { flex: 1 1 calc(33.33% - 8px); min-width: 60px; background: #fafafa; border: 1px solid #eee; border-radius: 10px; padding: 10px 6px; text-align: center; }
  .item-num { font-size: 17px; font-weight: 700; color: #222; }
  .item-unit { font-size: 11px; color: #777; margin-top: 3px; }
  .birthday { text-align: center; padding: 16px; }
  .birthday-label { font-size: 13px; color: #666; margin-bottom: 6px; }
  .birthday-value { font-size: 18px; font-weight: 700; color: #111; white-space: nowrap; overflow-x: auto; }
  @media (max-width: 360px) { input { font-size: 15px; padding: 10px 4px; } .precision-value { font-size: 22px; } .item { flex: 1 1 calc(50% - 8px); } }
</style>
</head>
<body>
<div class="container">
  <h1>高精度年龄计算器</h1>
  <div class="card">
    <div class="label">输入出生日期（默认今天往前16年，每天自动更新）</div>
    <div class="input-row">
      <div class="input-box"><input type="tel" id="yearInput" maxlength="4" placeholder="年" inputmode="numeric"></div>
      <span class="sep">-</span>
      <div class="input-box"><input type="tel" id="monthInput" maxlength="2" placeholder="月" inputmode="numeric"></div>
      <span class="sep">-</span>
      <div class="input-box"><input type="tel" id="dayInput" maxlength="2" placeholder="日" inputmode="numeric"></div>
    </div>
    <div class="hint" id="hint">默认今天往前16年，已自动计算</div>
    <button onclick="startCalc()">开始计算</button>
  </div>

  <div class="card result">
    <div id="preciseAge" class="precision-value">--</div>
    <div id="precisionLabel" class="precision-label">岁（精度 16 位小数，实时刷新）</div>
  </div>

  <div class="card">
    <div style="font-size:13px;color:#666;margin-bottom:2px;">详细数据</div>
    <div class="grid">
      <div class="item"><div class="item-num" id="rYears">--</div><div class="item-unit">年</div></div>
      <div class="item"><div class="item-num" id="rMonths">--</div><div class="item-unit">月</div></div>
      <div class="item"><div class="item-num" id="rDays">--</div><div class="item-unit">天</div></div>
      <div class="item"><div class="item-num" id="rHours">--</div><div class="item-unit">小时</div></div>
      <div class="item"><div class="item-num" id="rMinutes">--</div><div class="item-unit">分钟</div></div>
      <div class="item"><div class="item-num" id="rSeconds">--</div><div class="item-unit">秒</div></div>
    </div>
  </div>

  <div class="card birthday">
    <div class="birthday-label">距离下一个生日</div>
    <div id="nextBirthday" class="birthday-value">--</div>
  </div>
</div>

<script>
const yi = document.getElementById('yearInput');
const mi = document.getElementById('monthInput');
const di = document.getElementById('dayInput');
const hint = document.getElementById('hint');
const STORAGE_KEY = 'age_calc_birth';
const MIN_YEAR = 1900;

let currentBirth = null; // 当前正在计算的出生日期（Date对象）
let timer = null;
let lastDayCheck = new Date().getDate(); // 用于检测跨天

// 今天往前16年
function getDefaultBirth() {
  const t = new Date();
  t.setFullYear(t.getFullYear() - 16);
  return t;
}

// 初始化输入框（填默认日期）
function fillDefault() {
  const def = getDefaultBirth();
  yi.value = def.getFullYear();
  mi.value = String(def.getMonth() + 1).padStart(2, '0');
  di.value = String(def.getDate()).padStart(2, '0');
}

// 初始化
function init() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    const parts = saved.split('-');
    const y = parseInt(parts[0]);
    if (y >= MIN_YEAR && parts[1] && parts[2]) {
      yi.value = y;
      mi.value = parts[1];
      di.value = parts[2];
      hint.textContent = '已加载保存的日期';
      return;
    }
  }
  fillDefault();
  hint.textContent = '默认今天往前16年，已自动计算';
}
init();

// 输入事件：只管跳格、过滤、标记，绝不计算
function markChanged() {
  hint.textContent = '已修改日期，请点击"开始计算"';
  hint.className = 'hint modified';
}
yi.addEventListener('input', function() {
  let v = this.value.replace(/\D/g, ''); if (v.length > 4) v = v.slice(0, 4); this.value = v;
  if (v.length === 4) { const y = parseInt(v); if (y < MIN_YEAR) { alert('年份不能早于 1900 年，已自动设为 1900'); this.value = '1900'; } mi.focus(); }
  markChanged();
});
mi.addEventListener('input', function() {
  let v = this.value.replace(/\D/g, ''); if (v.length > 2) v = v.slice(0, 2); this.value = v;
  if (v.length === 2) di.focus();
  markChanged();
});
di.addEventListener('input', function() {
  let v = this.value.replace(/\D/g, ''); if (v.length > 2) v = v.slice(0, 2); this.value = v;
  markChanged();
});

// 唯一触发计算的地方：按钮
function startCalc() {
  const y = parseInt(yi.value), m = parseInt(mi.value), d = parseInt(di.value);
  if (!y || !m || !d) { hint.textContent = '请输入完整日期'; return; }
  if (y < MIN_YEAR) { hint.textContent = '年份不能早于 1900 年'; return; }
  if (m < 1 || m > 12 || d < 1 || d > 31) { hint.textContent = '日期不合法'; return; }
  const birth = new Date(y, m - 1, d, 0, 0, 0);
  if (isNaN(birth.getTime())) { hint.textContent = '日期不合法，如 2023-02-30 不存在'; return; }
  const today0 = new Date(); today0.setHours(0,0,0,0);
  if (birth >= today0) { hint.textContent = '请选择今天之前的日期'; return; }

  localStorage.setItem(STORAGE_KEY, y + '-' + String(m).padStart(2,'0') + '-' + String(d).padStart(2,'0'));
  currentBirth = birth;
  hint.textContent = '已计算';
  hint.className = 'hint';
  if (timer) clearInterval(timer);
  doCalc();
  timer = setInterval(doCalc, 50);
}

// 执行计算（用 currentBirth）
function doCalc() {
  if (!currentBirth) return;
  const now = new Date();
  const diff = now - currentBirth;
  const msY = 365.2425 * 24 * 60 * 60 * 1000;
  document.getElementById('preciseAge').textContent = (diff / msY).toFixed(16);
  document.getElementById('rYears').textContent = Math.floor(diff / (365.2425 * 24 * 60 * 60 * 1000));
  document.getElementById('rMonths').textContent = Math.floor(diff / (30.436875 * 24 * 60 * 60 * 1000));
  document.getElementById('rDays').textContent = Math.floor(diff / (24 * 60 * 60 * 1000));
  document.getElementById('rHours').textContent = Math.floor(diff / (60 * 60 * 1000)).toLocaleString();
  document.getElementById('rMinutes').textContent = Math.floor(diff / (60 * 1000)).toLocaleString();
  document.getElementById('rSeconds').textContent = Math.floor(diff / 1000).toLocaleString();

  const m = currentBirth.getMonth();
  const d = currentBirth.getDate();
  let nb = new Date(now.getFullYear(), m, d);
  if (nb < now) nb = new Date(now.getFullYear() + 1, m, d);
  const rem = nb - now;
  const dl = Math.ceil(rem / (24 * 60 * 60 * 1000));
  const hl = Math.floor((rem % (24 * 60 * 60 * 1000)) / (60 * 60 * 1000));
  const ml = Math.floor((rem % (60 * 60 * 1000)) / (60 * 1000));
  const sl = Math.floor((rem % (60 * 1000)) / 1000);
  document.getElementById('nextBirthday').textContent = (dl <= 0 && hl === 0 && ml === 0 && sl <= 1) ? '🎉 生日快乐！' : dl + '天' + hl + '时' + ml + '分' + sl + '秒';

  // 检测跨天：自动更新默认日期并重新算
  const today = new Date();
  if (today.getDate() !== lastDayCheck) {
    lastDayCheck = today.getDate();
    // 如果没有用户自定义记录（用的是默认），就更新默认并自动重算
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) {
      fillDefault();
      currentBirth = getDefaultBirth();
      hint.textContent = '已跨天，默认日期自动更新为今天往前16年';
    }
  }
}

// 页面加载：自动用默认日期算
currentBirth = getDefaultBirth();
doCalc();
timer = setInterval(doCalc, 50);
</script>
</body>
</html>

  .btn {

    background: #12b7f5;

    border: none;
    border-radius: 999px;
    text-decoration: none;
    box-shadow: 0 4px 12px rgba(18,183,245,.4);
  }
</style>
</head>
<body>
  <a class="btn"
     href="mqqapi://card/show_pslcard?src_type=internal&version=1&uin=1063807305&card_type=group&source=external">
    进入

  <script>
    // 兜底：如果 800ms 后还在页面，就跳你原来的 QQ 群网页分享页
    let left = false;
    setTimeout(function () {
      if (!left) {
        location.href = "https://qun.qq.com/universal-share/share?ac=1&authKey=Qv1N8NmpMUFlkeeYY1Gh1fyMpO0gyB2mVCjwJrUO6nOCU%2BbP3jA3lDlhoK0Ofjyd&busi_data=eyJncm91cENvZGUiOiIxMDYzODA3MzA1IiwidG9rZW4iOiJJcklZWUtrdE9mT0xRTHFISDFVdjNyR3ZnMHRERlZYdjlBalFSRDJCRWVyVXVoK2xBQjNNWmt5RDdFaWYzQUVvIiwidWluIjoiMzc5NzE5Nzg4NCJ9&data=YhYPJjQuncGbLXnhbqCX6ZUyTG3LfAa_-6YJuENMYVoQO9aRamq69R2I9V7VaprJxJmIu2p2-AglD80w9Jpe6Q&svctype=4&tempid=h5_group_info";
      }
    }, 800);

    // 尝试唤起
    document.querySelector('.btn').addEventListener('click', function () {
      left = true;
      location.href = "mqqapi://card/show_pslcard?src_type=internal&version=1&uin=1063807305&card_type=group&source=external";
    });
  </script>
</body>
</html>
